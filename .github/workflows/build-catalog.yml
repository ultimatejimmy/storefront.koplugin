name: Build and Deploy Catalog

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Catalog Baseline
        uses: actions/cache@v4
        with:
          path: .cache/catalog_baseline.json
          key: storefront-catalog-baseline-${{ github.run_id }}
          restore-keys: |
            storefront-catalog-baseline-

      - name: Build Catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cache
          if [ -f .cache/catalog_baseline.json ]; then
            cp .cache/catalog_baseline.json catalog.json
          fi
          python tools/build_catalog.py
          python tools/verify_catalog.py
          cp catalog.json .cache/catalog_baseline.json

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

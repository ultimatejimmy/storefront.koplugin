name: Release

on:
  push:
    tags:
      - '**' # Matches any tag including those with slashes
  workflow_dispatch: # Allows manual triggering from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Opt-in to Node 24 to clear deprecation warnings

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      - name: Fetch Latest Catalog Snapshot
        run: |
          TMP_CATALOG="/tmp/latest_catalog.json"
          if curl -fsSL --retry 3 --max-time 30 "https://ultimatejimmy.github.io/storefront.koplugin/catalog.json" -o "$TMP_CATALOG" && python tools/verify_catalog.py "$TMP_CATALOG"; then
            cp "$TMP_CATALOG" storefront.koplugin/catalog.json
            echo "Bundled fresh gh-pages catalog.json into release workspace."
          else
            echo "Warning: failed to fetch/verify gh-pages catalog.json; keeping repository snapshot."
          fi

      - name: Create Plugin Archive
        run: |
          # Package the plugin directory into a zip file
          # Excluding hidden files and git metadata
          zip -r storefront.koplugin.zip storefront.koplugin -x "*.git*" "*/.*"

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            storefront.koplugin.zip
          draft: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
